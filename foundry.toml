[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ast = true
ffi = true
build_info = true
extra_output = ["storageLayout"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
cbor_metadata = false
bytecode_hash = "none"
ignored_warnings_from = ["lib"]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
